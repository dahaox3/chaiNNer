name: GFISRv2 compatibility

on:
    push:
        branches: [gfisrv2-support]
    pull_request:
        paths:
            - 'backend/src/nodes/impl/pytorch/**'
            - 'backend/src/packages/chaiNNer_pytorch/**'
            - 'backend/tests/test_gfisrv2.py'
            - '.github/workflows/gfisrv2.yml'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    model-compatibility:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ['3.10', '3.12']
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: pip
            - name: Install matching CPU PyTorch packages
              run: python -m pip install torch==2.7.0 torchvision==0.22.0 --index-url https://download.pytorch.org/whl/cpu
            - name: Install adapter test dependencies
              run: python -m pip install spandrel==0.4.1 pytest ruff==0.14.2 pyright==1.1.338
            - name: Check maintained integration code
              run: |
                  ruff check backend/src/nodes/impl/pytorch/gfisrv2.py backend/tests/test_gfisrv2.py backend/src/packages/chaiNNer_pytorch/pytorch/io/load_model.py
                  ruff format --check backend/src/nodes/impl/pytorch/gfisrv2.py backend/tests/test_gfisrv2.py backend/src/packages/chaiNNer_pytorch/pytorch/io/load_model.py
            - name: Verify model loading and inference without private weights
              run: python -m pytest backend/tests/test_gfisrv2.py -v
            - name: Check Spandrel API compatibility
              run: python -m pyright --pythonpath "$pythonLocation/bin/python" backend/src/nodes/impl/pytorch/gfisrv2.py
