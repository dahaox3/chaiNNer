name: ComicRead image bridge

on:
    push:
        branches: [gfisrv2-support]
    pull_request:
        paths:
            - 'backend/**'
            - '.github/workflows/comicread.yml'
    workflow_dispatch:

jobs:
    opencomic-daemon:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: Verify TTA routing against the pinned OpenComic package
              working-directory: backend/src/nodes/impl/opencomic
              run: |
                  npm ci --omit=dev --ignore-scripts --no-audit --no-fund
                  node patch-daemon-tta.cjs .
                  node --test ../../../../tests/test_opencomic_daemon.cjs

    bridge:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ['3.10', '3.12']
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}
            - name: Install CPU bridge test dependencies
              run: python -m pip install pytest pytest-asyncio numpy==1.26.4 opencv-python-headless==4.8.0.76 Pillow==10.4.0 requests==2.28.2 psutil typing_extensions chainner_ext==0.3.10 ruff==0.14.2
            - name: Check backend style
              run: |
                  ruff check backend
                  ruff format --check backend
            - name: Exercise HTTP, cache and executor lifecycle
              run: python -m pytest backend/tests/test_comicread.py backend/tests/test_opencomic.py -v
